[project]
name = "scrubs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.35.0",
    "click>=8.1.8",
    "pydantic>=2.9.2",
    "pytest>=8.3.4",
]

[project.scripts]
scrubs = "scrubs.cli:main"

[tool.uv]
dev-dependencies = [
    "py-spy>=0.4.0",
    "pyright>=1.1.391",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
